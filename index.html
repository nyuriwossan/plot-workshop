<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<title>プロット設計工房</title>
<style>
:root{
  --bg:#f6f3ec; --surface:#fffdf8; --surface2:#efeadf; --ink:#1f2430; --muted:#6a6e78;
  --line:#e2dccf; --accent:#34458c; --accent-soft:#e3e7f5; --accent-ink:#fff;
  --hard:#a33a2c; --hard-soft:#f6e3df; --warn:#9a6a10; --warn-soft:#f7edd6;
  --ok:#2f7a4f; --ok-soft:#dcefe3; --info:#3d6a8a; --info-soft:#e0ecf3;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --radius:14px; --navh:62px; --meterh:46px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181d; --surface:#1f222a; --surface2:#272b35; --ink:#e9e6df; --muted:#9a9ea8;
    --line:#323744; --accent:#93a3ea; --accent-soft:#2a3150; --accent-ink:#141726;
    --hard:#ef8a7b; --hard-soft:#3d2622; --warn:#e7bb63; --warn-soft:#3a3020;
    --ok:#7fcf9e; --ok-soft:#1f3529; --info:#8fc1e3; --info-soft:#1f2f3b;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;
  padding-bottom:calc(var(--navh) + var(--meterh) + env(safe-area-inset-bottom) + 16px)}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 6px;max-width:680px;margin:0 auto}
header h1{font-family:var(--mincho);font-weight:600;font-size:22px;letter-spacing:.06em;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
main{max-width:680px;margin:0 auto;padding:4px 16px 0}
section.tab{display:none}
section.tab.active{display:block}
h2{font-family:var(--mincho);font-weight:600;font-size:18px;margin:18px 0 6px;letter-spacing:.04em;
  display:flex;align-items:baseline;gap:8px}
h2 small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted)}
h3{font-size:14px;margin:14px 0 6px}
.lead{color:var(--muted);font-size:13px;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc button{all:unset;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;display:block}
.svc button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset}
.svc b{display:block;font-size:17px}
.svc span{display:block;font-size:12px;color:var(--muted);line-height:1.5}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
label.f .hint{display:block;font-weight:400;color:var(--muted);font-size:12px}
input[type=text],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:88px;resize:vertical;line-height:1.6}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.cnt{font-size:11.5px;color:var(--muted);text-align:right;margin-top:2px;font-variant-numeric:tabular-nums}
.cnt.over{color:var(--hard);font-weight:700}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:13.5px;
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:20px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--hard);border-color:var(--hard-soft)}
.btn.sm{font-size:12px;padding:5px 10px}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:nowrap}
.seg button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 11px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle span{font-size:14px}
.toggle small{display:block;color:var(--muted);font-size:12px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{left:21px}
/* cards */
.area{margin-top:10px}
.area>summary{list-style:none;cursor:pointer;font-family:var(--mincho);font-size:17px;font-weight:600;
  display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  -webkit-tap-highlight-color:transparent}
.area>summary::-webkit-details-marker{display:none}
.area>summary small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400;margin-left:auto;white-space:nowrap}
.area:not([open])>summary small::after{content:"・タップで開く";color:var(--accent);font-weight:600}
.area>summary::after{content:"";flex:none;width:9px;height:9px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);
  transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.area[open]>summary::after{transform:rotate(45deg);margin-top:-5px}
.area[open]>summary{border-color:var(--accent)}
.area.en>summary{border-left:4px solid var(--accent)}
.area>summary:active{opacity:.8}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;transition:border-color .15s}
.card.on{border-color:var(--accent)}
.card.merged{opacity:.75}
.chead{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chead .sw{margin-top:2px}
.cid{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.04em}
.clabel{font-size:14.5px;font-weight:600;line-height:1.45}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.bdg{white-space:nowrap;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.bdg.hard{background:var(--hard-soft);color:var(--hard);font-weight:700}
.bdg.edit{background:var(--warn-soft);color:var(--warn)}
.bdg.opt{background:var(--info-soft);color:var(--info)}
.bdg.clar{background:var(--ok-soft);color:var(--ok)}
h2.grp{margin-top:26px;padding-top:10px;border-top:1px solid var(--line)}
details.infos{margin:8px 0}
details.infos>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
.cbody{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.ctext{margin:8px 0 2px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.note{font-size:12px;color:var(--muted);margin:4px 0}
.msg{border-radius:10px;padding:8px 11px;font-size:13px;margin:6px 0;line-height:1.55}
.msg.error{background:var(--hard-soft);color:var(--hard)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.info{background:var(--info-soft);color:var(--info)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg b{font-weight:700}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:0 -2px}
/* chars */
.char{border-left:3px solid var(--accent)}
.swbox{background:var(--surface2);border-radius:10px;padding:10px;margin:10px 0}
.swbox label.f{margin-top:8px}
.swprev{font-size:13px;background:var(--surface);border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.swprev:empty::before{content:"（入力するとここに出力文が出ます）";color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.chk input{width:18px;height:18px}
/* output */
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--surface2)}
.fhead b{font-size:14px}
.fhead .tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--ok-soft);color:var(--ok);margin-left:6px;font-weight:600}
.fhead .tag.nocount{background:var(--surface);color:var(--muted)}
.fbody{padding:10px 12px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;line-height:1.7}
.fbody:empty::before{content:"（空欄）";color:var(--muted)}
.ffoot{display:flex;justify-content:space-between;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.big{font-variant-numeric:tabular-nums;font-size:26px;font-family:var(--mincho);font-weight:600}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .2s}
.bar i.near{background:var(--warn)}
.bar i.over{background:var(--hard)}
.breakdown{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
/* meter + nav */
#meter{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));height:var(--meterh);
  background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20;cursor:pointer}
#meter .mtxt{font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
#meter .bar{flex:1;margin:0}
#meter .wc{font-size:11px;padding:1px 7px;border-radius:999px;white-space:nowrap}
nav#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:21}
nav#tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
nav#tabs button .n{font-family:var(--mincho);font-size:17px;line-height:1}
nav#tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--meterh) + env(safe-area-inset-bottom) + 12px);transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hide{display:none!important}
.mt0{margin-top:0}
.guide{padding:12px 14px}
.guide .gtitle{font-family:var(--mincho);font-size:16px}
.guide ol{margin:6px 0 0;padding-left:1.4em;font-size:14px;line-height:1.75}
.guide li::marker{color:var(--accent);font-weight:700}
.area.help>summary{font-family:var(--sans);font-size:14.5px}
.area.help>summary::after{margin-left:auto}
.mdout{margin-top:22px}
.area.sub{margin-top:8px}
.area.sub>summary{font-family:var(--sans);font-size:14px;padding:10px 12px}
.area.sub>summary::after{margin-left:auto}
.area.sub .area.sub>summary{background:var(--surface);font-size:13.5px;padding:9px 12px}
.area.tpl{margin:12px 0 4px}
.area.tpl>.helpbody{padding-top:6px}
.tplprev{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--surface2);border-radius:8px;padding:8px 10px;margin:4px 0 0;min-height:2.4em}
.tplprev:empty::before{content:"（入力するとここに出力が表示されます）";color:var(--muted);font-family:var(--sans)}
.mdout .fbody{font-family:var(--mono);font-size:12.5px}
.helpbody{padding:10px 4px 2px;font-size:13.5px;line-height:1.7}
.helpbody p{margin:0 0 10px}
.helpbody dl{margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.helpbody dt{font-weight:700;white-space:nowrap}
.helpbody dd{margin:0;color:var(--muted)}
.opt{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--surface2);color:var(--muted);vertical-align:1px}
</style>
</head>
<body>
<header>
  <h1>プロット設計工房</h1>
  <p>困りごとを防ぐカードと表現を強くするカードを選ぶと、AIチャット用の指示文に変換して、サービスの入力欄ごとに分けて出力します。</p>
</header>
<main>
  <section class="tab" id="tab-service"></section>
  <section class="tab" id="tab-cards"></section>
  <section class="tab" id="tab-world"></section>
  <section class="tab" id="tab-chars"></section>
  <section class="tab" id="tab-out"></section>
</main>
<div id="meter" role="button" aria-label="字数の状況。タップで出力へ"></div>
<nav id="tabs" role="tablist">
  <button data-tab="service" role="tab"><span class="n">壱</span>設定</button>
  <button data-tab="cards" role="tab"><span class="n">弐</span>カード</button>
  <button data-tab="world" role="tab"><span class="n">参</span>世界</button>
  <button data-tab="chars" role="tab"><span class="n">肆</span>キャラ</button>
  <button data-tab="out" role="tab"><span class="n">伍</span>出力</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hide">

<script>
"use strict";
const DATA = {
  "schema_version": "1.2.0",
  "project": "AIチャット用プロット設計工房",
  "description": "選択式の困りごとカード。プロット一本をサービスの入力欄ごとに配分する想定。AIでの有効性は未実証。",
  "stages": {
    "min": "最小",
    "short": "短縮",
    "standard": "標準",
    "detail": "詳細"
  },
  "areas": {
    "rp": "RP運用",
    "narration": "ナレーション",
    "character": "キャラクター"
  },
  "design_rules": [
    "最小版も、境界型は「禁止対象＋代替描写」を維持する",
    "詳細版ほど説明を増やすが、原則の意味を変えない",
    "条件・例外・終了条件は必要なものをセットで扱う",
    "禁止の有無や文型の優劣は実証なしに断定しない",
    "自由記述の世界観・開始状況や、別の切り替わりビルダーと重複させない",
    "placement=globalのカードは全員共通のルール欄へ1回だけ出力する（キャラごとに重複させない）",
    "rule_kind=enhance／criticality=optional の表現強化カードは初期OFF。字数内に収めるでは最初に段階を下げ、次にOFFにする",
    "clarified（行動を明確化した文）は試験機能。基本文と二重出力しない。境界の範囲は変えない"
  ],
  "cards": [
    {
      "id": "RP01",
      "area": "rp",
      "label": "ユーザーの言動を代筆しない",
      "rule_kind": "boundary",
      "criticality": "hard",
      "variants": {
        "min": "{{user}}の言動を確定せず、{{char}}側を描く。",
        "short": "{{user}}の発言・行動を代筆しない。{{char}}の反応と周囲を描く。",
        "standard": "{{user}}の台詞・行動・選択をAIが確定しない。描写は{{char}}の言動と環境に限定し、{{user}}が応答できる余地を残す。",
        "detail": "{{user}}の台詞、身体動作、選択、返答をAI側で新たに決定・確定しない。{{char}}および他の登場人物の反応、周囲の状況、行動の結果として観測できる変化を描写する。{{user}}の次の行動は本人の入力に委ねる。"
      },
      "notes": "最優先の境界候補。{{user}}本人が既に入力した行為を受けて結果を描くことは妨げない。",
      "placement": "global",
      "clarified": {
        "min": "{{user}}の言動は本人の入力に委ねて確定せず、{{char}}と状況を描く。",
        "short": "{{user}}の台詞・行動は本人の入力に委ねる。AIは{{char}}の反応と周囲の変化を描き、未入力の言動を確定しない。",
        "standard": "各返信では{{char}}の言動、他の登場人物の反応、環境の変化を描く。{{user}}の台詞・行動・選択は本人が入力した範囲に基づいて扱い、未入力の言動をAI側で決定しない。",
        "detail": "すべての返信で{{user}}の発言・動作・選択・返答を本人の入力に委ねる。AIが進めるのは{{char}}や周囲の人物の反応、環境、すでに入力された行為の結果とする。{{user}}の未入力の言動を新たに確定しない。会話の節目では{{user}}が次の行動を選べる余地を残す。"
      }
    },
    {
      "id": "RP02",
      "area": "rp",
      "label": "ユーザーの心理を決めつけない",
      "rule_kind": "boundary",
      "criticality": "hard",
      "variants": {
        "min": "{{user}}の内心は断定せず、{{char}}の推測として描く。",
        "short": "{{user}}の感情・意図を確定しない。必要なら{{char}}の推測として表す。",
        "standard": "{{user}}の感情、欲求、意図、記憶をAIが断定しない。{{char}}が受け取った印象は推測として示し、実際の内心は{{user}}に委ねる。",
        "detail": "{{user}}の内心、動機、欲求、過去の記憶、身体感覚をAIが勝手に確定しない。{{char}}が相手の表情や言葉から推察する場合は「〜かもしれない」のように人物の認識として扱い、事実とは区別する。{{user}}自身が明示した心理は反映してよい。"
      },
      "notes": "",
      "placement": "global",
      "clarified": {
        "min": "{{user}}の内心は本人の入力に委ね、{{char}}の推測は推測として描く。",
        "short": "{{user}}の感情や記憶を扱う際は、{{char}}が受け取った印象と本人が明示した内容を区別する。内心をAIが断定しない。",
        "standard": "{{user}}の感情や意図に触れる場面では、{{char}}が言動から受け取った印象や推測として描く。{{user}}本人の内心や記憶は入力に基づいて扱い、推測を確定した事実にしない。",
        "detail": "{{user}}の感情・意図・記憶・身体感覚については本人が入力した情報を基準とする。{{char}}の理解が必要な場面では、表情や既出の発言から受けた印象として描き、人物の推測と客観的事実を区別する。本人の入力がない内心をAI側で新しい事実として確定しない。"
      }
    },
    {
      "id": "RP03",
      "area": "rp",
      "label": "選択権をユーザーに残す",
      "rule_kind": "boundary",
      "criticality": "hard",
      "variants": {
        "min": "重要な選択は{{user}}に委ね、{{char}}は提案に留める。",
        "short": "進路や返答をAIが一方的に決めない。{{char}}の提案と反応を示す。",
        "standard": "対話・関係・目的に関わる重要な選択は{{user}}に委ねる。{{char}}は提案、誘導、反対をしてよいが、{{user}}が選んだことにはしない。",
        "detail": "物語を進めるために{{user}}の決断を先取りしない。{{char}}は自らの立場に沿って要求・交渉・説得・拒否できるが、{{user}}の承諾、移動、契約、関係の選択を既成事実化しない。重要な分岐では状況と相手側の働きかけを描き、決定権を{{user}}に残す。"
      },
      "notes": "",
      "placement": "global"
    },
    {

function activeItems(){

    if(!s.on) return;
    const m = merged.find(m=>m.members[0]===c.id);
    if(m){
      const st = STAGES[Math.max(...m.members.map(id=>STAGES.indexOf(state.cards[id].stage)))];

      items.push({id:m.id, area:groupOf(c), hard, text:m.variants[st], min:m.variants.min, label:m.label});
      return;

    if(skip.has(c.id)) return;
    items.push({id:c.id, area:groupOf(c), hard:c.criticality==="hard", text:textOf(c,s), min:textOf(c,s,"min"), label:c.label});

const cut = s => (s||"").trim().replace(/[。．.、，,]+$/,"");
function switchText(w){
  const n=cut(w.normal), t=cut(w.trigger), ch=cut(w.changed), r=cut(w.ret);
  let out="";
  if(n) out += `通常は${n}。`;
  if(t && ch){
    if(/(たら|ると|れば|なら)$/.test(t)) out += `${t}、${ch}。`;
    else out += `${/(とき|時|際|中|間|後|場合|最中|以降)$/.test(t)?t:t+"とき"}は、${ch}。`;
  } else if(ch) out += `${ch}。`;
  if(w.permanent){ if(t||ch) out += "この変化は元に戻らない。"; }
  else if(r){
    let rr=r;
    if(/(たら|ば|と|なら)$/.test(rr)) {}
    else if(/た$/.test(rr)) rr+="ら";
    else if(/(後|時|とき|以降)$/.test(rr)) rr+="は";
    else if(/[うくぐすつぬぶむる]$/.test(rr)) rr+="と";
    else rr+="になったら";
    out += `${rr}、通常の状態に戻る。`;
  }
  return rep(out);
}

function tplItems(items, vals, fmt){ return items.map(it=>tplItem(it, vals[it.k], fmt)).filter(Boolean).join("\n"); }
function charTplText(c, fmt){
  if(!c.tpl || !c.tpl.on) return "";
  return CHAR_TPL.map(cat=>{ const body = tplItems(cat.items, c.tpl.v, fmt); return body ? head(cat.h, fmt)+body : ""; }).filter(Boolean).map(rep).join("\n");
}

/* fmt: "plain"（通常テキスト）| "md"（Markdown）。どちらも同じカード・セクション情報から組み立てる */
const mdTitle = h => h.replace(/^【|】$/g,"");
function head(h, fmt){ return fmt==="md" ? `## ${mdTitle(h)}\n` : (state.headings ? h+"\n" : ""); }
function bullet(t){ return "- " + t.replace(/\n/g, "\n  "); }
function ruleLines(lines, fmt){ return (fmt==="md" ? lines.map(bullet) : lines).join("\n"); }
function rulesText(fmt="plain"){
  const items = activeItems();
  const parts = [];
  GROUPS.forEach(a=>{
    const lines = items.filter(i=>i.area===a).map(i=>rep(i.text));
    if(!lines.length) return;
    parts.push(head(AREA_HEAD[a], fmt) + ruleLines(lines, fmt));
  });
  const ex = state.extra.trim();
  if(ex) parts.push(head("【追加指示】", fmt) + rep(ex));
  return parts.join("\n\n");
}
function worldText(fmt="plain"){
  const w = state.world;
  const sec = [["world","【世界観・舞台】"],["terms","【用語】"],["userRole","【{{user}}の立場】"],["relation","【関係】"],["opening","【開始状況】"]];
  const T = state.worldTpl && state.worldTpl.on;
  const body = k => {
    if(!T) return w[k].trim();
    if(k==="world") return [tplItems(WORLD_TPL_ITEMS, state.worldTpl.v, fmt), w.world.trim()].filter(Boolean).join(fmt==="md"?"\n\n":"\n");
    if(k==="terms" && fmt==="md") return tlines(w.terms).map(l=>"- "+l).join("\n");
    return w[k].trim();
  };
  return sec.map(([k,h])=>[h, body(k)]).filter(([,b])=>b).map(([h,b])=>rep(head(h, fmt)+b)).join("\n\n");
}
function charProfileText(c, fmt="plain"){
  const parts = [];
  if(c.profile.trim()) parts.push(rep(c.profile.trim()));
  const tt = charTplText(c, fmt); if(tt) parts.push(tt);
  const sw = c.switches.map(switchText).filter(Boolean);
  if(sw.length) parts.push(head("【切り替わり】", fmt) + ruleLines(sw, fmt));
  return parts.join("\n\n");
}
function repeatText(fmt="plain"){
  const lines = activeItems().filter(i=>i.hard).map(i=>rep(i.min));
  return lines.length ? head("【再確認】", fmt) + ruleLines(lines, fmt) : "";
}
function buildOutput(fmt="plain"){
  const S = svc(); const fields = [];
  const rules = rulesText(fmt), world = worldText(fmt);
  if(state.service==="zeta"){
    fields.push({label:"題名", text:state.title.trim(), max:S.titleMax, counted:true});
    fields.push({label:"説明", text:world, counted:true, note:"世界観・関係・開始状況"});
    fields.push({label:"ナレーター（非公開）", text:rules, counted:true, note:"RPルール・語り・人物共通ルール"});
    state.chars.forEach((c,i)=>{
      fields.push({label:`${charName(i)}｜名前`, text:c.name.trim(), max:S.nameMax, counted:true});
      fields.push({label:`${charName(i)}｜プロフィール`, text:charProfileText(c, fmt), counted:true});
    });
  } else {
    const place = state.zetterPlace;
    const sit = [place!=="cast"?rules:"", world, state.zetterRepeat?repeatText(fmt):""].filter(Boolean).join("\n\n");
    fields.push({label:"いまの状況", text:sit, counted:true, note:place!=="cast"?"ルール＋世界観・関係・開始状況":"世界観・関係・開始状況"});
    state.chars.forEach((c,i)=>{
      fields.push({label:`${charName(i)}｜名前`, text:c.name.trim(), max:S.nameMax, counted:S.countNames});
      const prof = [charProfileText(c, fmt), place!=="situation"?rules:""].filter(Boolean).join("\n\n");
      fields.push({label:`${charName(i)}｜性格・設定`, text:prof, counted:true});
    });
  }
  fields.forEach(f=>f.count=len(f.text));
  const total = fields.filter(f=>f.counted).reduce((a,f)=>a+f.count,0);
  return {fields,total,limit:S.limit};
}
function totalChars(){ return buildOutput().total; }

/* ---------- warnings ---------- */
function warnings(){
  const W = []; const S = svc(); const out = buildOutput();
  if(out.total>out.limit) W.push({level:"error",msg:`<b>字数超過</b>：${out.total.toLocaleString()}／${out.limit.toLocaleString()}字。カードの「字数内に収める」を試すか、自由記述を短くしてください。`});
  if(state.service==="zeta"){
    if(!state.title.trim()) W.push({level:"warn",msg:"題名が未入力です（Zetaでは必須）。"});
    if(len(state.title)>S.titleMax) W.push({level:"error",msg:`題名が${S.titleMax}字を超えています。`});
  }
  state.chars.forEach((c,i)=>{
    const nm = charName(i);
    if(!c.name.trim()) W.push({level:"warn",msg:`${nm}：名前が未入力です（必須）。`});
    if(len(c.name)>S.nameMax) W.push({level:"error",msg:`${nm}：名前が${S.nameMax}字を超えています。`});
    if(state.service==="zetter" && !c.profile.trim()) W.push({level:"warn",msg:`${nm}：性格・設定が空です（Zetterでは必須）。`});
    c.switches.forEach((w,j)=>{
      const has = [w.trigger,w.changed].some(x=>x.trim());
      if(!has && !w.ret.trim() && !w.normal.trim()) return;
      if(!w.trigger.trim()||!w.changed.trim()) W.push({level:"warn",msg:`${nm}：切り替わり${j+1}の「きっかけ」か「変化後」が空です。`});
      if(has && !w.ret.trim() && !w.permanent) W.push({level:"warn",msg:`${nm}：切り替わり${j+1}に「戻る条件」がありません。戻らない変化なら「元に戻らない」にチェックしてください。未入力のままだと、状態が戻らなくなるおそれがあります。`});
    });
  });
  const on = id => state.cards[id] && state.cards[id].on;
  DATA.pairs.forEach(p=>{ if(p.ids.every(on)) W.push({level:p.level,msg:`<b>${p.ids.join("＋")}</b>：${esc(prettyLabel(p.msg))}`}); });
  DATA.merges.forEach(m=>{
    if(m.members.every(on) && state.merge[m.id]===false) W.push({level:"info",msg:`<b>${m.members.join("＋")}</b>は内容が重なっています。統合文にすると字数を節約できます（カード画面で切替）。`});
  });
  const enOn = DATA.cards.filter(c=>isEN(c) && on(c.id) && c.id!=="EN20").length;
  if(enOn>=3 && !on("EN20")) W.push({level:"info",msg:`表現強化カードを${enOn}枚選んでいます。描写が盛られすぎると感じたら、<b>EN20</b>（効果的な要素を選ぶ）を足すと抑えられるかもしれません。`});
  if(!DATA.cards.filter(c=>c.criticality==="hard").some(c=>on(c.id))) W.push({level:"info",msg:"必須カード（ユーザーの代筆防止など）が全てオフです。"});
  if(state.chars.length>1 && state.charMode==="keep") W.push({level:"info",msg:"キャラが複数いるとき、{{char}}が誰を指すかはサービス次第で曖昧です。表記を「キャラクター」にするのが無難です。"});
  if(on("NA12") && state.chars.length>1) W.push({level:"warn",msg:"NA12（一人称の語り）：キャラが複数いると、誰の一人称かが曖昧になります。"});
  if(state.service==="zetter" && state.zetterPlace!=="situation" && state.chars.length>1) W.push({level:"info",msg:`ルールを各キャストに置く設定のため、同じルールが${state.chars.length}人分重複して字数を使います。`});
  return W;
}

function cardHtml(c, merged){

  const text = textOf(c,s);
  let h = `<div class="card ${s.on?"on":""} ${inMerge?"merged":""}" data-id="${c.id}">
    <div class="chead" data-act="toggle" data-id="${c.id}">

        <div class="clabel">${esc(prettyLabel(c.label))}</div>
        <div class="badges">
          ${c.criticality==="hard"?`<span class="bdg hard">必須</span>`:""}
          ${c.criticality==="optional"?`<span class="bdg opt">任意</span>`:""}
          <span class="bdg">${KIND_LABEL[c.rule_kind]||c.rule_kind}</span>
          ${s.style==="clarified"?`<span class="bdg clar">明確化</span>`:""}
          ${s.override.trim()?`<span class="bdg edit">編集済み</span>`:""}
          ${inMerge?`<span class="bdg">統合中</span>`:""}
        </div>
      </div>
    </div>`;
  if(s.on){
    h += `<div class="cbody">
      ${s.override.trim()?`<p class="note">編集した文が使われます（段階の切替は効きません）。</p>`:
      `${c.clarified?`<div class="seg" style="margin-bottom:6px">${[["base","通常の指示"],["clarified","行動を明確化（試験）"]].map(([v,l])=>`<button data-act="style" data-id="${c.id}" data-v="${v}" aria-pressed="${s.style===v}">${l}</button>`).join("")}</div>`:""}
      <div class="seg">${STAGES.map(st=>`<button data-act="stage" data-id="${c.id}" data-v="${st}" aria-pressed="${s.stage===st}">${STAGE_LABEL[st]}</button>`).join("")}</div>`}
      <div class="ctext">${esc(rep(text))}</div>
      <div class="cnt">${len(rep(text))}字</div>
      ${editing===c.id?`
        <textarea data-act="override" data-id="${c.id}" placeholder="自由に書き換えられます">${esc(s.override||vset(c,s)[s.stage])}</textarea>
        <div class="row" style="margin-top:6px"><button class="btn sm" data-act="editdone">閉じる</button><button class="btn sm danger" data-act="editreset" data-id="${c.id}">元の文に戻す</button></div>`
      :`<div class="row"><button class="btn sm ghost" data-act="edit" data-id="${c.id}">文を編集</button></div>`}
      ${s.style==="clarified"?`<p class="note">試験版の文です。通常の指示より少し長くなります。</p>`:""}
      ${c.notes?`<p class="note">${esc(prettyLabel(c.notes))}</p>`:""}
    </div>`;
  }
  return h + `</div>`;
}

  let inner = `<label class="toggle"><span>テンプレートの内容を出力に含める<small>オフにしても入力した内容は消えません。オンの間だけ出力されます。</small></span><input type="checkbox" class="sw" data-bind="${path}.on" ${tpl.on?"checked":""}></label>`;
  if(kind==="w"){
    inner += `<p class="note">「世界観・舞台」を項目に分けて入力できます。用語・立場・関係・開始状況は下の欄をそのまま使います。</p>`;
    inner += WORLD_TPL_ITEMS.map(it=>tplField(`${path}.v`, it, tpl.v[it.k])).join("");
  } else {
    inner += `<p class="note">名前は上の「名前」欄が使われます（テンプレートには重ねて出力しません）。空欄の項目は出力されません。</p>`;
    inner += CHAR_TPL.map(cat=>fold(`${id}-${cat.key}`, mdTitle(cat.h), (cat.note?`<p class="note mt0">${cat.note}</p>`:"") + cat.items.map(it=>tplField(`${path}.v`, it, tpl.v[it.k])).join(""))).join("");
  }
  inner += `<label class="f">出力プレビュー（Markdown）</label><pre class="tplprev" data-tplprev="${kind==="w"?"w":i}">${esc(tplPreview(kind, i))}</pre>`;
  return fold(id, `Markdownテンプレートを使う（任意）${tpl.on?`<span class="bdg clar" style="margin-left:6px">オン</span>`:""}`, inner, "tpl");
}

function renderOut(){
  const o = buildOutput(); const S = svc(); const W = warnings();
  const pct = Math.min(100, o.total/o.limit*100);
  const cls = o.total>o.limit?"over":(o.total>o.limit*0.9?"near":"");
  const order = {error:0,warn:1,info:2};
  W.sort((a,b)=>order[a.level]-order[b.level]);
  let html = `
  <h2>出力 <small>${S.name}の欄ごとに分けています</small></h2>
  <div class="panel">
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <span class="big">${o.total.toLocaleString()}<span style="font-size:14px;color:var(--muted)"> ／ ${o.limit.toLocaleString()}字</span></span>
      <span class="note" style="${o.total>o.limit?"color:var(--hard);font-weight:700":""}">${o.total>o.limit?`超過 ${(o.total-o.limit).toLocaleString()}字`:`残り ${(o.limit-o.total).toLocaleString()}字`}</span>
    </div>
    <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
    <div class="breakdown">${o.fields.filter(f=>f.counted&&f.count).map(f=>`${esc(f.label)} ${f.count}`).join("・")||"まだ何も入力されていません"}</div>
    <p class="note">サービス側の数え方（改行や記号の扱い）と差が出ることがあります。上限ぎりぎりは避けてください。</p>
  </div>`;
  const main = W.filter(w=>w.level!=="info"), info = W.filter(w=>w.level==="info");
  if(main.length) html += `<h3>確認事項（${main.length}）</h3>` + main.map(w=>`<div class="msg ${w.level}">${w.msg}</div>`).join("");
  else html += `<div class="msg ok">修正が必要な点はありません。</div>`;
  if(info.length) html += `<details class="infos"><summary>重なり・参考情報（${info.length}）</summary>${info.map(w=>`<div class="msg info">${w.msg}</div>`).join("")}</details>`;
  html += `<div class="msg info">ここにある欄だけがAIに届きます。紹介ページはAIに渡らないので、設定は書かないでください。</div>`;
  o.fields.forEach((f,k)=>{ html += fieldHtml(f, k, "copy"); });
  html += mdSection(o);
  $("#tab-out").innerHTML = html;

let mdOpen = false;
function fieldHtml(f, k, act){
  const over = f.max && f.count>f.max;
  return `<div class="field">
      <div class="fhead"><div><b>${esc(f.label)}</b>${f.counted?`<span class="tag">字数に含む</span>`:`<span class="tag nocount">字数外</span>`}</div>

      <div class="fbody">${esc(f.text)}</div>
      <div class="ffoot"><span>${f.note?esc(f.note):""}</span><span class="${over?"cnt over":""}">${f.count}字${f.max?`／${f.max}`:""}</span></div>
    </div>`;
}
function mdSection(plain){
  const m = buildOutput("md");
  const diff = m.total - plain.total;
  const pct = Math.min(100, m.total/m.limit*100);
  const cls = m.total>m.limit?"over":(m.total>m.limit*0.9?"near":"");
  let h = `<details class="area help mdout" id="mdOut" ${mdOpen?"open":""}>
    <summary>Markdown形式で出力（任意）</summary>
    <div class="helpbody">
      <p class="note mt0">見出しや箇条書きで構造を整理した形式です。内容は通常テキスト版と同じで、書式だけが違います。AIへの指示の効果を保証するものではありません。</p>
      <div class="panel" style="margin:8px 0">
        <div class="row" style="justify-content:space-between;align-items:baseline">
          <span class="big" style="font-size:22px">${m.total.toLocaleString()}<span style="font-size:13px;color:var(--muted)"> ／ ${m.limit.toLocaleString()}字</span></span>
          <span class="note">通常版より ${diff>=0?"+":""}${diff.toLocaleString()}字</span>
        </div>
        <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
        <p class="note">#、-、改行などの記号も字数に含めています。見出しは「見出し【】」の設定にかかわらず ## で付きます。</p>
      </div>
      ${m.total>m.limit?`<div class="msg error"><b>Markdown版は字数超過</b>：${m.total.toLocaleString()}／${m.limit.toLocaleString()}字（超過 ${(m.total-m.limit).toLocaleString()}字）。Markdown版では文を自動で短くしません。カードを減らすか段階を下げてください。</div>`:""}`;
  m.fields.forEach((f,k)=>{ h += fieldHtml(f, k, "copymd"); });

}

document.addEventListener("click", async e=>{
  const nav = e.target.closest("nav#tabs button"); if(nav){ go(nav.dataset.tab); return; }
  if(e.target.closest("#meter")){ go("out"); return; }
  const b = e.target.closest("[data-act]"); if(!b || b.tagName==="TEXTAREA") return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case "service": state.service = b.dataset.v; break;
    case "toggle": state.cards[id].on = !state.cards[id].on; if(!state.cards[id].on && editing===id) editing=null; break;
    case "stage": state.cards[id].stage = b.dataset.v; break;
    case "style": state.cards[id].style = b.dataset.v; break;
    case "allstage": DATA.cards.forEach(c=>{ if(!state.cards[c.id].override) state.cards[c.id].stage=b.dataset.v; }); toast(`すべて「${STAGE_LABEL[b.dataset.v]}」にしました`); break;
    case "hardon": DATA.cards.forEach(c=>{ if(c.criticality==="hard") state.cards[c.id].on=true; }); toast("必須カードをオンにしました"); break;
    case "alloff": DATA.cards.forEach(c=>state.cards[c.id].on=false); editing=null; fitReport=null; break;
    case "fit": fitBudget(); return;
    case "merge": state.merge[id] = state.merge[id]===false; break;
    case "edit": editing = id; break;
    case "editdone": editing = null; break;
    case "editreset": state.cards[id].override=""; editing=null; break;
    case "addchar": state.chars.push(newChar()); break;
    case "delchar": if(confirm(`${charName(+b.dataset.i)}を削除しますか？`)){ state.chars.splice(+b.dataset.i,1); [...openFolds].filter(k=>k[0]==="c").forEach(k=>openFolds.delete(k)); } else return; break;
    case "addsw": state.chars[+b.dataset.i].switches.push(newSwitch()); break;
    case "delsw": state.chars[+b.dataset.i].switches.splice(+b.dataset.j,1); break;
    case "copy": { const f = buildOutput().fields[+b.dataset.k]; if(await copyText(f.text)) toast(`「${f.label}」をコピーしました`); return; }
    case "copymd": { const f = buildOutput("md").fields[+b.dataset.k]; if(await copyText(f.text)) toast(`「${f.label}」をMarkdownでコピーしました`); return; }
    case "export": exportJson(); return;
    case "copyjson": if(await copyText(JSON.stringify(packState(),null,2))) toast("JSONをコピーしました"); return;

    default: return;
  }
  save(); render();
});

/* ---------- fit to budget ---------- */
function fitBudget(){
  const lim = svc().limit;
  if(totalChars()<=lim){ fitReport=null; toast("すでに上限内です"); render(); return; }
  const lowered = new Set(), turnedOff = [], skipped = new Set();
  const label = id => `${id}`;
  const done = ok => {
    const parts = [];
    if(turnedOff.length) parts.push(`表現強化を<b>${turnedOff.length}枚オフ</b>（${turnedOff.join("・")}）`);
    if(lowered.size) parts.push(`<b>${lowered.size}枚</b>の段階を下げました（${[...lowered].join("・")}）`);
    if(skipped.size) parts.push(`手で編集したカード（${[...skipped].join("・")}）は変更していません`);
    if(!ok) parts.push("これ以上は自動で縮められません。カードを減らすか、世界観やキャラの自由記述を短くしてください");
    fitReport = {ok, html:parts.join("。")+"。"};
    save(); render(); window.scrollTo(0,0);
    toast(ok ? `上限内に収めました（${totalChars().toLocaleString()}字）` : "自動では上限内に収まりませんでした");
  };
  const lower = (pred, target) => {
    let changed=false;
    DATA.cards.forEach(c=>{
      const s=state.cards[c.id];
      if(!s.on || !pred(c)) return;
      if(s.override.trim()){ skipped.add(c.id); return; }
      if(STAGES.indexOf(s.stage)>target){ s.stage=STAGES[target]; lowered.add(label(c.id)); changed=true; }
    });
    return changed;
  };
  // 1) 表現強化（任意）の段階を最小まで下げる
  for(let t=2;t>=0;t--){ if(lower(isEN,t) && totalChars()<=lim) return done(true); }
  // 2) 表現強化を長い順にオフ
  const ens = DATA.cards.filter(c=>isEN(c) && state.cards[c.id].on && !state.cards[c.id].override.trim())
    .sort((a,b)=>len(textOf(b,state.cards[b.id]))-len(textOf(a,state.cards[a.id])));
  DATA.cards.filter(c=>isEN(c) && state.cards[c.id].on && state.cards[c.id].override.trim()).forEach(c=>skipped.add(c.id));
  for(const c of ens){ state.cards[c.id].on=false; lowered.delete(c.id); turnedOff.push(c.id); if(totalChars()<=lim) return done(true); }
  // 3) 困りごとカード：語り→人物共通→RP運用→必須 の順に段階を下げる（オフにはしない）
  const groups = [
    c=>!isEN(c) && c.area==="narration" && c.criticality!=="hard",
    c=>!isEN(c) && c.area==="character" && c.criticality!=="hard",
    c=>!isEN(c) && c.area==="rp" && c.criticality!=="hard",
    c=>c.criticality==="hard"
  ];
  for(let t=2;t>=0;t--){ for(const g of groups){ if(lower(g,t) && totalChars()<=lim) return done(true); } }
  done(false);
}

/* ---------- copy / io ---------- */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    let ok=false; try{ ok=document.execCommand("copy"); }catch(_){}
    ta.remove(); if(!ok) toast("コピーできませんでした。長押しで選択してください。"); return ok;
  }
}
function packState(){
  const s = JSON.parse(JSON.stringify(state)); delete s.tab;
  return {schema:SCHEMA, schema_version:SCHEMA_VERSION, cards_version:DATA.schema_version, saved_at:new Date().toISOString(), state:s};
}
function exportJson(){
  const blob = new Blob([JSON.stringify(packState(),null,2)], {type:"application/json"});
  const a = document.createElement("a"); const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  const base = (state.title.trim()||charName(0)).replace(/[\\/:*?"<>|\s]/g,"_").slice(0,20);
  a.href = URL.createObjectURL(blob); a.download = `plot_${base}_${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importText(txt){
  try{
    const o = JSON.parse(txt);
    if(!o || o.schema!==SCHEMA || !o.state) throw new Error("schema");
    const tab = state.tab; state = normalize(o.state); state.tab = tab; editing=null; save(); render();
    toast("読み込みました");
  }catch(e){ toast("読み込めませんでした。このツールで保存したJSONか確認してください。"); }
}

render();
</script>
